name: 'CI Pipeline'
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  block-merge-label:
    runs-on: ubuntu-latest
    steps:
      - name: Check for "do not merge" label
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS_JSON" | tr '[:upper:]' '[:lower:]' | grep -q '"do not merge"'; then
            echo "::error::Merge blocked: PR is labeled 'do not merge'."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:release
      - uses: actions/upload-artifact@v4
        with:
          name: widget-dist
          path: packages/login-widget/dist/*

  e2e:
    needs: [build]
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    runs-on: ${{ matrix.os }}
    # GitHub secrets still use legacy VITE_FR_* names — remap to FR_* for runtime
    env:
      FR_AM_URL: ${{ secrets.VITE_FR_AM_URL }}
      FR_AM_COOKIE_NAME: ${{ secrets.VITE_FR_AM_COOKIE_NAME }}
      FR_REALM_PATH: ${{ secrets.VITE_FR_REALM_PATH }}
      FR_AM_WELLKNOWN_URL: ${{ secrets.FR_AM_WELLKNOWN_URL }}
      FR_AM_ADMIN_USERNAME: ${{ secrets.FR_AM_ADMIN_USERNAME }}
      FR_AM_ADMIN_PASSWORD: ${{ secrets.FR_AM_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Cache Playwright browser binaries between runs (~200MB for Chromium)
      # playwright is a devDependency of the e2e workspace, so commands must be scoped
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @forgerock/login-widget-e2e exec playwright --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @forgerock/login-widget-e2e exec playwright install chromium
      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        run: pnpm --filter @forgerock/login-widget-e2e exec playwright install-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: widget-dist
          path: packages/login-widget/dist
      # login-app resolves $core/* through the built package dist; build it
      # before the app (the widget build job already built it upstream, but
      # core/dist is not part of the uploaded artifact).
      - run: pnpm run build:framework-core
      - run: pnpm --filter @forgerock/login-app run build
      - name: e2e
        run: pnpm --filter @forgerock/login-widget-e2e exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: Upload blob report to GitHub Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ runner.os }}-${{ matrix.shardIndex }}
          path: e2e/blob-report
          if-no-files-found: ignore
          retention-days: 1

  merge-e2e-report:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    if: always()
    needs: [e2e]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Download blob reports from GitHub Actions Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-${{ runner.os }}-*
          merge-multiple: true

      - name: Merge into HTML Report
        run: |
          if [ -d all-blob-reports ] && [ "$(ls -A all-blob-reports 2>/dev/null)" ]; then
            pnpm --filter @forgerock/login-widget-e2e exec playwright merge-reports --config=merge.config.ts ../all-blob-reports
          else
            echo "No blob reports found — skipping merge"
          fi

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report--attempt--${{ runner.os }}-${{ github.run_attempt }}
          path: e2e/playwright-report
          retention-days: 14

  test-lint-storybook-build:
    runs-on: ubuntu-latest
    # GitHub secrets still use legacy VITE_FR_* names — remap to FR_* for runtime
    env:
      FR_AM_URL: ${{ secrets.VITE_FR_AM_URL }}
      FR_AM_COOKIE_NAME: ${{ secrets.VITE_FR_AM_COOKIE_NAME }}
      FR_REALM_PATH: ${{ secrets.VITE_FR_REALM_PATH }}
      FR_AM_WELLKNOWN_URL: ${{ secrets.FR_AM_WELLKNOWN_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:lint
      # svelte-check gate: without this a contributor who bypasses the husky
      # pre-commit hook can land --threshold=warning failures on main.
      # svelte-check needs the gitignored generated registry
      # (core/journey/_utilities/registry/custom-registry.ts) and the seeded
      # layout wrappers (custom/components/layout/), which exist only after a
      # build: the customRegistry Vite plugin seeds the wrappers and
      # regenerates the registry at buildStart, and the published build's
      # exclude list keeps the e2e canary stage out of the registry.
      # build:widget = build:framework-core + the widget build, which also leaves
      # core/dist and packages/login-widget/dist for the later app tests and
      # the Storybook build in this job.
      - run: pnpm run build:widget
      # Run the widget vite-config suite with dist present: its artifact
      # assertions only bite when the built ESM/IIFE bundles exist.
      - run: pnpm --filter @forgerock/login-widget exec vitest run 'vite-config'
      - run: pnpm run check:svelte
      - run: pnpm run test
      # The MCP stdio wire test spawns the compiled CLI (tools/cli/dist, gitignored);
      # build it before the CLI suite or the test fails on every fresh checkout.
      - run: pnpm --filter @forgerock/login-framework-cli run build
      - run: pnpm --filter @forgerock/login-framework-cli run test
      - run: pnpm --filter @forgerock/login-app run test
      - name: Install Playwright for Storybook tests
        run: pnpm --filter @forgerock/login-widget exec playwright install --with-deps chromium
      - name: Build Storybook
        run: pnpm run build:storybook --quiet
      - name: Serve Storybook and run tests
        run: |
          pnpm exec concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
            "pnpm exec http-server storybook-static --port 6006 --silent" \
            "pnpm exec wait-on tcp:6006 && pnpm run test:storybook"

  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Chromatic needs full git history for onlyChanged
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Pinned major: @latest runs mutable third-party code with
      # CHROMATIC_PROJECT_TOKEN in env; every other action in this repo is
      # version-pinned.
      - uses: chromaui/action@v13
        with:
          onlyChanged: true
          externals: 'themes/default/**'
          exitOnceUploaded: true
          traceChanged: true
          diagnosticsFile: chromatic-diagnostics.json
          buildScriptName: 'build:storybook'
          exitZeroOnChanges: true
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromatic-build-artifacts-${{ github.run_id }}
          path: |
            chromatic-diagnostics.json
            **/build-storybook.log

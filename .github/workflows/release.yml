name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch/ref to publish from'
        required: false
        default: 'main'
        type: string
      dist_tag:
        description: 'npm dist-tag (e.g. beta, canary, next)'
        required: false
        default: 'beta'
        type: string
      prerelease:
        description: 'Changesets prerelease tag (beta/canary)'
        required: false
        default: 'beta'
        type: string
      access:
        description: 'npm access level'
        required: false
        default: 'public'
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for npm OIDC trusted publishing & provenance attestation
  packages: write # Required for pushing Docker images to GHCR

jobs:
  # ─── Stable / Beta (automatic on push to main) ─────────────────────────
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
          # No registry-url — OIDC trusted publishing handles auth without NODE_AUTH_TOKEN.
          # Setting registry-url creates an .npmrc with _authToken=${NODE_AUTH_TOKEN},
          # which prevents OIDC fallback even when the env var is unset.

      # Node 22.x ships npm 10.x; OIDC trusted publishing requires npm >= 11.6.
      # Use corepack to install the required npm version instead of self-upgrading
      # npm, which can fail on runners with corrupted pre-installed npm.
      - name: Install npm for OIDC trusted publishing
        run: |
          corepack enable npm
          corepack install -g npm@latest
          npm --version

      - run: pnpm install --frozen-lockfile

      - name: Build release artifacts
        run: pnpm run build:release

      # When pending changesets exist: creates/updates a "Version Packages" PR.
      # When no changesets remain (Version Packages PR was merged): publishes stable to @latest.
      # Auth is handled by npm OIDC — no NODE_AUTH_TOKEN needed.
      # Provenance attestation is automatic via publishConfig.provenance in package.json.
      - name: Create Release PR or Publish Stable
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # When stable was NOT just published and there are pending changesets,
      # publish a snapshot beta so every merge to main is immediately available
      # on npm via `npm install @forgerock/login-widget@beta`.
      #
      # The changesets/action leaves the runner on the `changeset-release/main`
      # branch where .changeset/*.md files have been consumed and package.json
      # is already bumped to the stable version. We must switch back to the
      # original commit so `changeset version --snapshot` can re-read the
      # original changesets and produce a proper snapshot version (e.g.
      # 1.4.0-beta-20260326202845) instead of the already-bumped stable version.
      - name: Publish Beta Snapshot
        if: steps.changesets.outputs.published != 'true' && steps.changesets.outputs.hasChangesets == 'true'
        run: |
          git checkout "$ORIGINAL_SHA"
          pnpm changeset version --snapshot beta

          VERSION=$(node -p "require('./packages/login-widget/package.json').version")
          if [[ "$VERSION" != *"-beta-"* ]]; then
            echo "::error::Expected a snapshot version containing '-beta-' but got '$VERSION'. Aborting publish to prevent releasing a stable version under the beta tag."
            exit 1
          fi
          echo "Publishing snapshot version: $VERSION"

          pnpm changeset publish --tag beta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORIGINAL_SHA: ${{ github.sha }}

      # Capture version after the beta snapshot step (if it ran) so the docker job gets the correct value.
      # For stable: package.json already has the correct version (bumped by the merged "Version Packages" PR).
      # For beta: the "Publish Beta Snapshot" step just rewrote package.json via `changeset version --snapshot`.
      - name: Read widget version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/login-widget/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Notify Slack (stable)
        if: steps.changesets.outputs.published == 'true'
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Published @forgerock/login-widget (stable) — <https://github.com/${{ github.repository }}/releases|View Release>"
            }

      - name: Notify Slack (beta)
        if: steps.changesets.outputs.published != 'true' && steps.changesets.outputs.hasChangesets == 'true'
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Published @forgerock/login-widget (beta snapshot) — <https://www.npmjs.com/package/@forgerock/login-widget?activeTab=versions|View on npm>"
            }

  # ─── Snapshot (manual via workflow_dispatch) ────────────────────────────
  snapshot:
    if: github.event_name == 'workflow_dispatch'
    name: Publish Snapshot
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install npm for OIDC trusted publishing
        run: |
          corepack enable npm
          corepack install -g npm@latest
          npm --version

      - run: pnpm install --frozen-lockfile

      - name: Build release artifacts
        run: pnpm run build:release

      - name: Version packages as prerelease
        run: pnpm changeset version --snapshot ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish must happen in this file — npm OIDC trusted publishing is
      # bound to the workflow filename configured on npmjs.com.
      - name: Publish snapshot
        run: pnpm publish -r --tag ${{ inputs.dist_tag }} --no-git-checks --access ${{ inputs.access }}

  # ─── Docker (publish to GHCR after npm release) ──────────────────────
  # Tags the image as "latest" when changesets publishes a stable npm release,
  # or "beta" when a beta snapshot is published (pending changesets exist).
  # Skips entirely when there's nothing to publish (no changesets, no release).
  docker:
    needs: release
    if: >-
      github.event_name == 'push' &&
      (needs.release.outputs.published == 'true' || needs.release.outputs.hasChangesets == 'true')
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine Docker tag
        id: docker-tag
        run: |
          if [ "$PUBLISHED" = "true" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          fi
        env:
          PUBLISHED: ${{ needs.release.outputs.published }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.docker-tag.outputs.tag }}
            type=raw,value=${{ needs.release.outputs.version }}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: deploy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
